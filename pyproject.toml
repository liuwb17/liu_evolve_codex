[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-aad"
version = "0.5.0"
description = "Reproducible block-level algorithm evolution with AHC001 and ALE-Bench"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aad = "aad.cli:main"

[tool.setuptools.packages.find]
include = ["aad*"]

[tool.setuptools.package-data]
aad = ["assets/*.py", "assets/*.cpp", "assets/*.md"]
